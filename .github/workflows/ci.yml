# .github/workflows/ci.yml — Jade Capital Suite CI
#
# Wave 10 slice 10.1 — 4 parallel jobs (lint-backend, test-backend,
# test-integration, test-frontend). Triggers on pull_request + push to
# the v1 readiness branch.
#
# Concurrency cancels superseded runs on the same ref so PR feedback stays
# responsive without burning runner minutes.

name: ci

on:
  pull_request:
    branches:
      - feature/0a-identity-model
      - feature/wave10-*
      - feature/wave12-*
      - feature/wave13-*
      - fix/password-recovery-*
  push:
    branches:
      - chore/*
      - ci/*
      - feature/0a-identity-model
      - feature/wave13-*
      - chore/angular20-security
      - fix/password-recovery-*

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: lint-backend — quick fail-fast on style + build warnings.
  # ---------------------------------------------------------------------------
  lint-backend:
    name: Lint backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
      FORMAT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      FORMAT_OLDEST_PUSHED_SHA: ${{ github.event.commits[0].id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', 'Directory.Build.props', 'Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore JadeCapital.slnx --locked-mode --nologo --verbosity minimal

      - name: Verify formatting
        run: |
          set -euo pipefail
          CHANGED_FILES_FILE="$(mktemp)"
          trap 'rm -f "$CHANGED_FILES_FILE"' EXIT
          bash scripts/changed-csharp-files.sh "$FORMAT_BASE_SHA" "$FORMAT_OLDEST_PUSHED_SHA" > "$CHANGED_FILES_FILE"
          mapfile -d '' CSHARP_FILES < "$CHANGED_FILES_FILE"
          if (( ${#CSHARP_FILES[@]} == 0 )); then
            echo "No changed C# files to format."
            exit 0
          fi
          dotnet format JadeCapital.slnx --include "${CSHARP_FILES[@]}" --verify-no-changes --verbosity minimal

      - name: Build (warnings-as-errors)
        run: dotnet build JadeCapital.slnx --nologo --verbosity minimal --no-restore

  # ---------------------------------------------------------------------------
  # Job 2: test-backend — fast unit-test loop (no Postgres / Redis).
  # ---------------------------------------------------------------------------
  test-backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', 'Directory.Build.props', 'Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore JadeCapital.slnx --locked-mode --nologo --verbosity minimal

      - name: Build
        run: dotnet build JadeCapital.slnx --nologo --verbosity minimal --no-restore

      - name: Shared.Kernel unit tests
        run: >-
          dotnet test tests/UnitTests/JadeCapital.Shared.Kernel.UnitTests/JadeCapital.Shared.Kernel.UnitTests.csproj
          --nologo --verbosity minimal --no-build
      - name: Identity unit tests
        run: >-
          dotnet test tests/UnitTests/JadeCapital.Identity.UnitTests/JadeCapital.Identity.UnitTests.csproj
          --nologo --verbosity minimal --no-build
      - name: Billing unit tests
        run: >-
          dotnet test tests/UnitTests/JadeCapital.Billing.UnitTests/JadeCapital.Billing.UnitTests.csproj
          --nologo --verbosity minimal --no-build
      - name: Trading unit tests
        run: >-
          dotnet test tests/UnitTests/JadeCapital.Trading.UnitTests/JadeCapital.Trading.UnitTests.csproj
          --nologo --verbosity minimal --no-build
      - name: Admin unit tests
        run: >-
          dotnet test tests/UnitTests/JadeCapital.Admin.UnitTests/JadeCapital.Admin.UnitTests.csproj
          --nologo --verbosity minimal --no-build

# Wave 10 slice 10.6 — OpenAPI export.
      # Boots the API in the background, pulls swagger.json from
      # /swagger/v1/swagger.json (Swashbuckle auto-generates the spec
      # when AddSwaggerGen() is registered in Program.cs), then uploads
      # it as a workflow artifact (30-day retention). The exit trap stops
      # the host whether startup succeeds, fails, or reaches the deadline.
      - name: Export OpenAPI spec
        env:
          ASPNETCORE_ENVIRONMENT: Development
          Jwt__Issuer: JadeCapitalSuite
          Jwt__Audience: JadeCapitalSuite.Client
          Jwt__AccessTokenSecret: ci-openapi-access-token-secret-at-least-32-characters
          Jwt__RefreshTokenSecret: ci-openapi-refresh-token-secret-at-least-32-characters
          ConnectionStrings__Storage: Endpoint=http://127.0.0.1:9000;AccessKey=ci-openapi;SecretKey=ci-openapi-storage-password;Bucket=ci-openapi;Ssl=false
        run: |
          set -euo pipefail
          dotnet run --project src/1.Api/JadeCapital.Host --no-build --urls http://localhost:8080 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true; wait "$API_PID" 2>/dev/null || true' EXIT
          for _ in {1..30}; do
            if curl --fail --silent --show-error \
                http://localhost:8080/swagger/v1/swagger.json \
                --output openapi.json.tmp; then
              test -s openapi.json.tmp
              mv openapi.json.tmp openapi.json
              exit 0
            fi
            rm -f openapi.json.tmp
            if ! kill -0 "$API_PID" 2>/dev/null; then
              wait "$API_PID"
              echo "API exited before exposing the OpenAPI document"
              exit 1
            fi
            sleep 1
          done
          echo "API never exposed the OpenAPI document"
          exit 1
      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v6
        with:
          name: openapi-spec
          path: openapi.json
          retention-days: 30
          if-no-files-found: error
  # ---------------------------------------------------------------------------
  # Job 3: test-integration — Postgres + Redis via GitHub-hosted services.
  # GitHub publishes service container ports on the runner loopback;
  # the tests and readiness probes must use those host-side endpoints.
  # ---------------------------------------------------------------------------
  test-integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
      ConnectionStrings__Postgres: "Host=127.0.0.1;Port=5432;Database=jadecapital;Username=jade;Password=secret"
      ConnectionStrings__Redis: "127.0.0.1:6379"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jadecapital
          POSTGRES_USER: jade
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jade -d jadecapital"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', 'Directory.Build.props', 'Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore JadeCapital.slnx --locked-mode --nologo --verbosity minimal

      - name: Build
        run: dotnet build JadeCapital.slnx --nologo --verbosity minimal --no-restore

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1; then
              echo "postgres ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "postgres never became ready"
          exit 1

      - name: Wait for Redis
        run: |
          for i in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/6379) >/dev/null 2>&1; then
              echo "redis ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "redis never became ready"
          exit 1

      - name: API integration tests
        run: >-
          dotnet test tests/IntegrationTests/JadeCapital.Api.IntegrationTests/JadeCapital.Api.IntegrationTests.csproj
          --nologo --verbosity minimal --no-build

  # ---------------------------------------------------------------------------
  # Job 4: test-frontend — Angular 19 unit tests + prod build sanity.
  # ---------------------------------------------------------------------------
  test-frontend:
    name: Frontend unit tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (locked)
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint --if-present

      - name: Unit tests (headless)
        run: npm test -- --runInBand

      - name: Production build
        env:
          SENTRY_RELEASE: ci-${{ github.sha }}
          APP_ENV: ci
          ALLOW_FRONTEND_SENTRY_DISABLED: "true"
        run: npm run build

  # ---------------------------------------------------------------------------
  # Job 5: test-a11y — Wave 12 slice 12.2 — axe-core / WCAG 2.1 AA.
  # Runs @axe-core/playwright against the anonymous-accessible surface
  # (landing / pricing / auth / legal) with the dev server spun up via
  # Playwright's `webServer` directive in playwright.config.ts. Critical
  # violations fail the job; serious/moderate are reported via the HTML
  # reporter (artifact below).
  # ---------------------------------------------------------------------------
  test-a11y:
    name: A11y (axe-core / WCAG 2.1 AA)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (locked)
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run axe-core a11y suite
        run: npm run test:a11y

      - name: Upload Playwright HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-a11y-report
          path: frontend/.playwright/report
          retention-days: 7
          if-no-files-found: ignore

  test-functional-e2e:
    name: Functional E2E (real stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: wave13-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run all five functional journeys
        run: >-
          docker compose
          -p "$COMPOSE_PROJECT_NAME"
          -f docker-compose.ci.yml
          up --build --abort-on-container-exit --exit-code-from e2e e2e

      - name: Tear down isolated stack
        if: always()
        run: >-
          docker compose
          -p "$COMPOSE_PROJECT_NAME"
          -f docker-compose.ci.yml
          down -v --remove-orphans

  test-postgres-pitr:
    name: PostgreSQL WAL-G PITR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: wave13-pitr-${{ github.run_id }}-${{ github.run_attempt }}
      ARCHIVE_DEADLINE_SECONDS: "60"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prove base/WAL coverage and isolated A/T/B recovery
        run: bash scripts/test-pitr.sh

  release-readiness:
    name: Archive consistency and non-delivering RC evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - lint-backend
      - test-backend
      - test-integration
      - test-frontend
      - test-a11y
      - test-functional-e2e
      - test-postgres-pitr
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate archive manifest and changelog
        run: python3 scripts/validate-release-readiness.py --root "$GITHUB_WORKSPACE"

      - name: Build exact-commit readiness evidence without delivery
        run: >-
          python3 scripts/build-rc-evidence.py
          --root "$GITHUB_WORKSPACE"
          --output artifacts/release/v1.1.0-rc1-readiness.json

      - name: Upload readiness evidence
        uses: actions/upload-artifact@v6
        with:
          name: v1.1.0-rc1-readiness-${{ github.sha }}
          path: artifacts/release/v1.1.0-rc1-readiness.json
          if-no-files-found: error
          retention-days: 30

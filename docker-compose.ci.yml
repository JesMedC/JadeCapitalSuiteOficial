services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jadecapital
      POSTGRES_USER: jade
      POSTGRES_PASSWORD: ci-postgres-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jade -d jadecapital"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - postgres-ci:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: quay.io/minio/minio:RELEASE.2024-08-17T01-24-54Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: jade-ci
      MINIO_ROOT_PASSWORD: ci-minio-password
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 30

  migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: jadecapital
      PGUSER: jade
      PGPASSWORD: ci-postgres-password
    volumes:
      - ./infrastructure/postgres/migrations:/migrations:ro
    command:
      - /bin/sh
      - -ec
      - |
        for sql in /migrations/*.sql; do
          echo "Applying $$(basename "$$sql")"
          psql -v ON_ERROR_STOP=1 -f "$$sql"
        done

  api:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.api.prod
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=jadecapital;Username=jade;Password=ci-postgres-password;Include Error Detail=true
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      ConnectionStrings__Storage: Endpoint=http://minio:9000;AccessKey=jade-ci;SecretKey=ci-minio-password;Bucket=jade-ci;Ssl=false
      Jwt__Issuer: JadeCapitalSuite
      Jwt__Audience: JadeCapitalSuite.Client
      Jwt__AccessTokenSecret: ci-access-token-secret-at-least-32-characters
      Jwt__RefreshTokenSecret: ci-refresh-token-secret-at-least-32-characters
      Jwt__AccessTokenTtlMinutes: "15"
      Jwt__RefreshTokenTtlDays: "14"
      RateLimit__AuthPermit: "1000"
      RateLimit__ApiPermit: "1000"
    healthcheck:
      test:
        - CMD-SHELL
        - awk 'BEGIN{p="1F90"} NR>1 {split($$2,a,":"); if (a[2]==p && $$4=="0A") found=1} END{exit !found}' /proc/net/tcp /proc/net/tcp6
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.frontend.prod
      args:
        SENTRY_RELEASE: wave13-ci
        APP_ENV: ci
        ALLOW_FRONTEND_SENTRY_DISABLED: "true"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 2s
      timeout: 5s
      retries: 30

  e2e:
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    depends_on:
      frontend:
        condition: service_healthy
    working_dir: /workspace/frontend
    environment:
      CI: "true"
      E2E_BASE_URL: http://frontend
    volumes:
      - .:/source:ro
      - frontend-workspace:/workspace/frontend
      - playwright-output:/workspace/frontend/.playwright
    command:
      - /bin/bash
      - -euc
      - set -o pipefail; tar --exclude='./node_modules' --exclude='./.playwright' -C /source/frontend -cf - . | tar -xf - && npm ci --no-audit --no-fund && npm run test:e2e -- auth.spec.ts journeys.spec.ts

volumes:
  postgres-ci:
  frontend-workspace:
  playwright-output:

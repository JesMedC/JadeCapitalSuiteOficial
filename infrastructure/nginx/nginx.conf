worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    client_max_body_size 20m;

    # Headers de seguridad básicos.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # $request_id is generated from 16 random bytes for each request. The frontend
    # proxy injects the same value into every script tag before returning HTML.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.stripe.com wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # HSTS preload-eligible: 2-year max-age + includeSubDomains + preload (spec §Requirement:HSTS).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Permissions-Policy: deny every browser API Jade Capital Suite does not use.
    # Stripe Elements runs inside an iframe (controlled by CSP frame-src), not via the
    # Payment Request API — so payment=() is the spec-compliant choice.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

    # Ocultar versión.
    server_tokens off;

    include /etc/nginx/conf.d/*.conf;
}
